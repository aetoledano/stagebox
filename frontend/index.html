<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>launcher</title>
</head>

<body>
    <div id="app"></div>
    <div class="topbar">
        <div class="indicators">
            <span id="clock" class="clock" aria-label="Clock"></span>
            <span id="bt-indicator" class="bti mdl2" title="Bluetooth Indicator">&#xE702;</span>
            <span id="controller-indicator" class="cmi mdl2" title="Controller Mapper Indicator">🎮</span>
        </div>

        <div class="title">
            <span class="title-text">StageBox</span>
            <span id="game-load-status" class="load-status idle" aria-label="Game library status" title="Game library status"></span>
        </div>

        <div class="actions">
            <button class="btn iconbtn mdl2" id="btn-tools-menu" aria-label="Open tools menu" aria-expanded="false"
                aria-controls="tools-menu-overlay" title="Tools">&#xE713;</button>
        </div>
    </div>

    <div id="tools-menu-overlay" class="menu-overlay" hidden>
        <div class="tools-menu" role="menu" aria-label="Tools menu">
            <button class="menu-item" id="btn-auto-bt-pair" role="menuitem" aria-label="Auto Bluetooth Pairing">
                <span class="menu-icon" aria-hidden="true">&#x1F517;&#xFE0E;</span>
                <span class="menu-label">Auto Bluetooth Pairing</span>
            </button>
            <button class="menu-item" id="btn-reload" role="menuitem" aria-label="Reload Launcher">
                <span class="menu-icon" aria-hidden="true">&#x1F5D8;&#xFE0E;</span>
                <span class="menu-label">Reload Launcher</span>
            </button>
            <button class="menu-item" id="btn-explorer" role="menuitem" aria-label="Open Games Folder">
                <span class="menu-icon" aria-hidden="true">&#x1F5C1;&#xFE0E;</span>
                <span class="menu-label">Open Games Folder</span>
            </button>
            <button class="menu-item" id="btn-restart" role="menuitem" aria-label="Restart System">
                <span class="menu-icon" aria-hidden="true">⟲</span>
                <span class="menu-label">Restart System</span>
            </button>
            <button class="menu-item" id="btn-shutdown" role="menuitem" aria-label="Power Off">
                <span class="menu-icon mdl2" aria-hidden="true">&#xE7E8;</span>
                <span class="menu-label">Power Off</span>
            </button>
        </div>
    </div>

    <div class="content hidebar">

    </div>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
