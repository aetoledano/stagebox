<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>launcher</title>
</head>

<body>
    <div id="app"></div>
    <div class="topbar">
        <div class="indicators">
            <span id="clock" class="clock" aria-label="Clock"></span>
            <span id="bt-indicator" class="bti mdl2" title="Bluetooth Indicator">&#xE702;</span>
            <span id="controller-indicator" class="cmi mdl2" title="Controller Mapper Indicator">🎮</span>
        </div>

        <div class="title">
            <span class="title-text">StageBox</span>
        </div>

        <div class="actions">
            <button class="btn iconbtn" id="btn-auto-bt-pair" aria-label="Auto BT Pairing On/Off" title="Auto BT Pairing On/Off">&#x1F517;&#xFE0E;</button>
            <button class="btn iconbtn" id="btn-reload" aria-label="Reload" title="Reload">&#x1F5D8;&#xFE0E;</button>
            <button class="btn iconbtn" id="btn-explorer" aria-label="Explorer"
                title="Explorer">&#x1F5C1;&#xFE0E;</button>
            <button class="btn iconbtn" id="btn-restart" title="Restart" aria-label="Restart">⟲</button>
            <button class="btn iconbtn mdl2" id="btn-shutdown" title="Power" aria-label="Power">&#xE7E8;</button>
        </div>
    </div>

    <div class="content hidebar">

    </div>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
