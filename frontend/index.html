<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>launcher</title>
</head>

<body>
    <div id="stagebox-scale-root">
        <div id="app"></div>
        <div class="topbar">
            <div class="indicators">
                <span id="clock" class="clock" aria-label="Clock"></span>
                <span id="bt-indicator" class="bti mdl2" title="Bluetooth Indicator">&#xE702;</span>
                <span id="wifi-indicator" class="wfi unknown" title="Wi-Fi status" role="img" aria-label="Wi-Fi status">
                    <span class="wfi-icon mdl2" aria-hidden="true">&#xE701;</span>
                </span>
                <span id="sound-indicator" class="sound-indicator unavailable" role="img" aria-label="Sound unavailable" title="Sound unavailable">
                    <span class="sound-icon mdl2" aria-hidden="true">&#xE767;</span>
                    <span class="sound-percent">--</span>
                </span>
                <span id="controller-indicator" class="cmi inactive" title="Controllers connected">
                    <span class="cmi-icon" aria-hidden="true"></span>
                    <span class="cmi-count">0</span>
                </span>
            </div>

            <div class="title">
                <span class="title-text">StageBox</span>
                <span id="game-load-status" class="load-status idle" aria-label="Game library status" title="Game library status"></span>
            </div>

            <div class="actions">
                <button class="btn iconbtn steam-btn" id="btn-open-steam" aria-label="Open Steam" title="Steam">
                    <img class="steam-icon" src="./src/assets/images/steam-ico.svg" alt="" aria-hidden="true" />
                </button>
                <button class="btn iconbtn mdl2" id="btn-tools-menu" aria-label="Open tools menu" aria-expanded="false"
                    aria-controls="tools-menu-overlay" title="Tools">&#xE713;</button>
            </div>
        </div>

        <div id="tools-menu-overlay" class="menu-overlay" hidden>
            <div class="tools-menu" role="menu" aria-label="Tools menu">
                <button class="menu-item" id="btn-debug-bt-pairing" role="menuitem" aria-label="Bluetooth Pair">
                    <span class="menu-icon" aria-hidden="true">&#x1F517;&#xFE0E;</span>
                    <span class="menu-label">Bluetooth Pair</span>
                </button>
                <button class="menu-item" id="btn-wifi-networks" role="menuitem" aria-label="Wi-Fi Networks">
                    <span class="menu-icon mdl2" aria-hidden="true">&#xE701;</span>
                    <span class="menu-label">Wi-Fi Networks</span>
                </button>
                <button class="menu-item" id="btn-sound-settings" role="menuitem" aria-label="Sound Settings">
                    <span class="menu-icon mdl2" aria-hidden="true">&#xE767;</span>
                    <span class="menu-label">Sound Settings</span>
                </button>
                <button class="menu-item" id="btn-reload" role="menuitem" aria-label="Reload Launcher">
                    <span class="menu-icon" aria-hidden="true">&#x1F5D8;&#xFE0E;</span>
                    <span class="menu-label">Reload Games</span>
                </button>
                <button class="menu-item" id="btn-explorer" role="menuitem" aria-label="Open Games Folder">
                    <span class="menu-icon" aria-hidden="true">&#x1F5C1;&#xFE0E;</span>
                    <span class="menu-label">Open Games Folder</span>
                </button>
                <button class="menu-item" id="btn-debug-exit" role="menuitem" aria-label="Exit to Windows">
                    <span class="menu-icon mdl2" aria-hidden="true">&#xE8BB;</span>
                    <span class="menu-label">Exit Launcher</span>
                </button>
                <button class="menu-item" id="btn-restart" role="menuitem" aria-label="Restart System">
                    <span class="menu-icon" aria-hidden="true">⟲</span>
                    <span class="menu-label">Restart</span>
                </button>
                <button class="menu-item" id="btn-shutdown" role="menuitem" aria-label="Power Off">
                    <span class="menu-icon mdl2" aria-hidden="true">&#xE7E8;</span>
                    <span class="menu-label">Power Off</span>
                </button>
            </div>
        </div>

        <div id="wifi-overlay" class="wifi-overlay" hidden>
            <div class="wifi-panel" role="dialog" aria-modal="true" aria-label="Wi-Fi Networks">
                <div class="wifi-head">
                    <h2>Wi-Fi Networks</h2>
                    <div class="wifi-actions">
                        <button class="wifi-btn" id="btn-wifi-refresh" type="button">Refresh</button>
                        <button class="wifi-icon-btn mdl2" id="btn-wifi-close" type="button" aria-label="Close">&#xE711;</button>
                    </div>
                </div>
                <div id="wifi-status" class="wifi-status"></div>
                <div id="wifi-list" class="wifi-list"></div>
                <form id="wifi-connect-form" class="wifi-form" hidden>
                    <div class="wifi-selected" id="wifi-selected"></div>
                    <input id="wifi-password" class="wifi-input" type="password" autocomplete="current-password" placeholder="Password" />
                    <button class="wifi-btn primary" id="btn-wifi-connect" type="submit">Connect</button>
                </form>
            </div>
        </div>

        <div id="sound-overlay" class="sound-overlay" hidden>
            <div class="sound-panel" role="dialog" aria-modal="true" aria-labelledby="sound-heading">
                <div class="sound-head">
                    <h2 id="sound-heading">Sound Settings</h2>
                    <div class="sound-actions">
                        <button id="btn-sound-refresh" class="sound-icon-btn mdl2" type="button" aria-label="Refresh sound outputs" title="Refresh">&#xE72C;</button>
                        <button id="btn-sound-close" class="sound-icon-btn mdl2" type="button" aria-label="Close sound settings" title="Close">&#xE711;</button>
                    </div>
                </div>
                <div class="sound-volume-row">
                    <button id="btn-sound-mute" class="sound-icon-btn mdl2" type="button" aria-label="Mute" title="Mute" aria-pressed="false">&#xE767;</button>
                    <input id="sound-volume" type="range" min="0" max="100" step="2" aria-label="Output volume" />
                    <output id="sound-volume-value" for="sound-volume">--</output>
                </div>
                <div id="sound-status" class="sound-status" role="status"></div>
                <div id="sound-devices" class="sound-devices" role="radiogroup" aria-label="Output device"></div>
            </div>
        </div>

        <div id="volume-feedback" class="volume-feedback" role="status" aria-live="polite" hidden>
            <span id="volume-feedback-icon" class="mdl2" aria-hidden="true">&#xE767;</span>
            <div class="volume-feedback-body">
                <div id="volume-feedback-device" class="volume-feedback-device"></div>
                <progress id="volume-feedback-bar" max="100" value="0" aria-label="Output volume"></progress>
            </div>
            <span id="volume-feedback-value" class="volume-feedback-value">0%</span>
        </div>

        <div class="content hidebar">

        </div>

        <div id="pairing-input-shield" class="pairing-input-shield" hidden></div>
    </div>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
