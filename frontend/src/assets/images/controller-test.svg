<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="controller-test-label">
  <title id="controller-test-label">Generic controller showing mapped button positions, sticks and triggers</title>
  <defs><linearGradient id="controller-shell" x2="0" y2="1"><stop stop-color="#334d42"/><stop offset="1" stop-color="#14271e"/></linearGradient></defs>
  <path d="M158 18H482C514 18 542 42 554 76C579 140 606 234 611 309C615 346 593 371 561 363C531 356 505 321 477 315C452 293 188 293 163 315C135 321 109 356 79 363C47 371 25 346 29 309C34 234 61 140 86 76C98 42 126 18 158 18Z" fill="url(#controller-shell)" stroke="#678576" stroke-width="3"/>
  <path d="M147 91H493" fill="none" stroke="#6c8a793d" stroke-width="2"/>
  <g data-button="LB"><rect x="114" y="64" width="137" height="23" rx="10" fill="#243d30" stroke="#779e87"/><text x="182" y="81" text-anchor="middle" fill="#e6f6ec" font-family="sans-serif" font-size="13">LB</text></g>
  <g data-button="RB"><rect x="389" y="64" width="137" height="23" rx="10" fill="#243d30" stroke="#779e87"/><text x="458" y="81" text-anchor="middle" fill="#e6f6ec" font-family="sans-serif" font-size="13">RB</text></g>
  <g data-button="LT"><rect x="143" y="26" width="79" height="29" rx="9" fill="#14271e" stroke="#779e87"/><rect data-trigger="left" x="148" y="30" width="0" height="21" rx="6" fill="#43d98e"/><text x="183" y="46" text-anchor="middle" fill="#e6f6ec" font-family="sans-serif" font-size="13">LT</text></g>
  <g data-button="RT"><rect x="418" y="26" width="79" height="29" rx="9" fill="#14271e" stroke="#779e87"/><rect data-trigger="right" x="423" y="30" width="0" height="21" rx="6" fill="#43d98e"/><text x="458" y="46" text-anchor="middle" fill="#e6f6ec" font-family="sans-serif" font-size="13">RT</text></g>
  <g data-button="L3"><circle cx="174" cy="143" r="40" fill="#102017" stroke="#779e87"/><circle data-stick="left" data-center-x="174" data-center-y="143" data-travel="12" cx="174" cy="143" r="25" fill="#334b3e" stroke="#9bb4a5"/><text x="174" y="199" text-anchor="middle" fill="#b1c9bc" font-family="sans-serif" font-size="11">LEFT STICK · L3</text></g>
  <g data-button="R3"><circle cx="399" cy="235" r="36" fill="#102017" stroke="#779e87"/><circle data-stick="right" data-center-x="399" data-center-y="235" data-travel="12" cx="399" cy="235" r="22" fill="#334b3e" stroke="#9bb4a5"/><text x="399" y="286" text-anchor="middle" fill="#b1c9bc" font-family="sans-serif" font-size="11">RIGHT STICK · R3</text></g>
  <g fill="#243d30" stroke="#779e87" stroke-width="1.5">
    <path data-button="DPAD_UP" d="M222 208H250V229L236 239L222 229Z"/>
    <path data-button="DPAD_DOWN" d="M222 272H250V251L236 241L222 251Z"/>
    <path data-button="DPAD_LEFT" d="M204 226V254H225L235 240L225 226Z"/>
    <path data-button="DPAD_RIGHT" d="M268 226V254H247L237 240L247 226Z"/>
  </g>
  <text x="236" y="287" text-anchor="middle" fill="#b1c9bc" font-family="sans-serif" font-size="11">D-PAD</text>
