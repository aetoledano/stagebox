  <g data-button="START"><rect x="333" y="136" width="41" height="27" rx="12" fill="#243d30" stroke="#779e87"/><text x="353" y="154" text-anchor="middle" fill="#e6f6ec" font-family="sans-serif" font-size="9">START</text></g>
  <g data-button="GUIDE"><circle cx="320" cy="107" r="12" fill="#243d30" stroke="#779e87"/><path d="M314 107L320 102L326 107M316 106V112H324V106" fill="none" stroke="#e6f6ec" stroke-width="1.5"/></g>
