name: Windows release bundle

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('check-{0}-{1}', github.run_number, github.run_attempt) }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source belongs to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo '::error::Use a release tag such as v0.43 or v0.43-beta.1 (letters, digits, dots, underscores and hyphens; up to 80 characters).'
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The release tag must point to a commit on main.'
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux and Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up frontend build tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up the helper SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install the matching Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build the complete release bundle
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: make release APP_VERSION="$RELEASE_TAG" SOURCE_COMMIT="$SOURCE_COMMIT"

      - name: Keep the release files for upload or recovery
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stagebox-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  upload:
    name: Attach files to the published release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the completed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          merge-multiple: true

      - name: Verify and attach the assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$actual_commit" != "$SOURCE_COMMIT" ]]; then
            echo '::error::The release tag moved after the build; no assets were uploaded.'
            exit 1
          fi
          sha256sum --check -- *.sha256
          gh release upload "$RELEASE_TAG" ./*.zip ./*.sha256 --repo "$GITHUB_REPOSITORY"
