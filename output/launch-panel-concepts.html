<div id="stagebox-launch-concepts">
  <div class="viz-carousel viz-dotted-background" aria-label="StageBox launch panel designs">
    <section data-variant="Cinematic" aria-label="Cinematic launch panel">
      <div class="sb-preview">
        <div class="sb-panel sb-cinematic" aria-label="Cinematic appearance controls" data-design="cinematic">
          <div class="sb-landscape" aria-hidden="true">
            <div class="sb-moon"></div><div class="sb-ridge sb-ridge-far"></div><div class="sb-ridge sb-ridge-near"></div>
            <div class="sb-tree sb-tree-one"></div><div class="sb-tree sb-tree-two"></div><div class="sb-tree sb-tree-three"></div>
            <div class="sb-dust"></div>
          </div>
          <div class="sb-cinematic-content">
            <div class="sb-eyebrow"><span class="sb-status-dot"></span><span data-kicker>LAUNCHING GAME</span></div>
            <h2>Don't Starve</h2>
            <p class="sb-message" data-message>Starting game…</p>
            <div class="sb-meter" role="progressbar" aria-label="Game launch in progress"><div class="sb-meter-fill"></div></div>
            <div class="sb-progress-caption" data-caption hidden>Downloading update · 58%</div>
            <button class="sb-confirm cursor-interaction" type="button" hidden>OK</button>
          </div>
          <div class="sb-edge-light" aria-hidden="true"></div>
        </div>
      </div>
    </section>
    <section data-variant="Pulse" aria-label="Pulse launch panel" hidden>
      <div class="sb-preview">
        <div class="sb-panel sb-pulse" aria-label="Pulse appearance controls" data-design="pulse">
          <div class="sb-orbit" aria-hidden="true"><div class="sb-halo"></div><div class="sb-orbit-track"></div><div class="sb-orbit-spin"></div><i data-lucide="gamepad-2"></i></div>
          <div class="sb-eyebrow" data-kicker>LAUNCHING GAME</div>
          <h2>Don't Starve</h2>
          <p class="sb-message" data-message>Starting game…</p>
          <div class="sb-meter" role="progressbar" aria-label="Game launch in progress"><div class="sb-meter-fill"></div></div>
          <div class="sb-progress-caption" data-caption hidden>Downloading update · 58%</div>
          <button class="sb-confirm cursor-interaction" type="button" hidden>OK</button>
        </div>
      </div>
    </section>
    <section data-variant="Arcade" aria-label="Arcade launch panel" hidden>
      <div class="sb-preview">
        <div class="sb-panel sb-arcade" aria-label="Arcade appearance controls" data-design="arcade">
          <div class="sb-grid" aria-hidden="true"></div>
          <div class="sb-bracket sb-bracket-tl" aria-hidden="true"></div><div class="sb-bracket sb-bracket-br" aria-hidden="true"></div>
          <div class="sb-arcade-top"><div class="sb-eyebrow" data-kicker>LAUNCHING GAME</div><i data-lucide="gamepad-2" aria-hidden="true"></i></div>
          <h2>Don't<br>Starve</h2>
          <div class="sb-arcade-bottom"><p class="sb-message" data-message>Starting game…</p><span class="sb-status-dot" aria-hidden="true"></span></div>
          <div class="sb-meter" role="progressbar" aria-label="Game launch in progress"><div class="sb-meter-fill"></div></div>
          <div class="sb-progress-caption" data-caption hidden>Downloading update · 58%</div>
          <button class="sb-confirm cursor-interaction" type="button" hidden>OK</button>
        </div>
      </div>
    </section>
  </div>
</div>
<style>
  #stagebox-launch-concepts .sb-preview { display:flex; align-items:center; justify-content:center; min-height:520px; padding:42px 24px 28px; box-sizing:border-box; }
  #stagebox-launch-concepts .sb-panel { --sb-green:#22aa77; --sb-ink:#fff; --sb-soft:#c5d1d4; position:relative; isolation:isolate; box-sizing:border-box; width:100%; max-width:560px; color:var(--sb-ink); background:#101c24; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; box-shadow:0 22px 65px #0007; overflow:hidden; }
  #stagebox-launch-concepts .sb-panel h2 { position:relative; font-size:clamp(29px,6vw,42px); line-height:1.1; font-weight:650; letter-spacing:-1.2px; margin:18px 0 15px; color:var(--sb-ink); overflow-wrap:anywhere; }
  #stagebox-launch-concepts .sb-eyebrow { display:flex; align-items:center; gap:9px; font-size:11px; line-height:1.4; font-weight:600; letter-spacing:2.5px; color:var(--sb-soft); }
  #stagebox-launch-concepts .sb-message { position:relative; font-size:16px; line-height:1.5; margin:0; color:var(--sb-soft); }
  #stagebox-launch-concepts .sb-status-dot { flex:none; width:6px; height:6px; background:var(--sb-green); border-radius:50%; box-shadow:0 0 14px var(--sb-green); animation:sb-breathe 2s ease-in-out infinite; }
  #stagebox-launch-concepts .sb-meter { height:3px; background:#ffffff14; border-radius:4px; overflow:hidden; position:relative; }
  #stagebox-launch-concepts .sb-meter-fill { width:34%; height:100%; background:linear-gradient(90deg,transparent,var(--sb-green),#b8ffdc); animation:sb-sweep 2.4s ease-in-out infinite; }
  #stagebox-launch-concepts .sb-progress-caption { margin-top:12px; color:var(--sb-soft); font-size:13px; line-height:1.5; }
  #stagebox-launch-concepts .sb-confirm { position:relative; display:block; margin-top:18px; border:1px solid var(--sb-green); border-radius:8px; padding:9px 24px; font:600 15px system-ui,sans-serif; color:var(--sb-ink); background:#174736; }
  #stagebox-launch-concepts [hidden] { display:none !important; }
  #stagebox-launch-concepts .sb-cinematic { min-height:320px; border-radius:18px; border:1px solid #75d5b149; background:#111e23; }
  #stagebox-launch-concepts .sb-landscape { position:absolute; inset:0; overflow:hidden; background:radial-gradient(ellipse at 76% 20%,#3b897452,transparent 54%),linear-gradient(155deg,#142326,#254b4b 68%,#0c1a1e); }
  #stagebox-launch-concepts .sb-landscape::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#0a151aee,#0a151a80 60%,transparent),linear-gradient(0deg,#0a141b 3%,transparent 90%); }
  #stagebox-launch-concepts .sb-moon { position:absolute; top:25px; right:69px; width:110px; height:110px; border-radius:50%; background:radial-gradient(circle at 38% 36%,#d9ecd5,#9dbead); box-shadow:0 0 60px #bde2c33b; opacity:.6; }
  #stagebox-launch-concepts .sb-ridge { position:absolute; bottom:0; left:10%; width:105%; height:60%; clip-path:polygon(0 65%,17% 26%,31% 47%,48% 12%,65% 42%,81% 2%,100% 40%,100% 100%,0 100%); background:#1c3738; }
  #stagebox-launch-concepts .sb-ridge-near { left:0; bottom:-28px; height:50%; background:#12272b; transform:scaleX(-1); }
  #stagebox-launch-concepts .sb-tree { position:absolute; width:75px; height:180px; bottom:0; right:12%; background:#0b1d22; clip-path:polygon(49% 0,29% 25%,40% 25%,15% 51%,32% 50%,0 82%,42% 78%,42% 100%,57% 100%,57% 78%,100% 82%,66% 50%,83% 51%,58% 25%,71% 25%); }
  #stagebox-launch-concepts .sb-tree-two { right:2%; bottom:-20px; transform:scale(.7); }
  #stagebox-launch-concepts .sb-tree-three { right:26%; bottom:-25px; transform:scale(.55); }
  #stagebox-launch-concepts .sb-dust { position:absolute; width:3px; height:3px; top:110px; right:120px; background:#dfffe3; border-radius:50%; box-shadow:-42px 60px 2px #dfffe3,58px 30px 2px #dfffe3,30px -55px 1px #dfffe3,-95px -30px 2px #dfffe3,75px 85px 2px #dfffe3; opacity:.4; animation:sb-float 7s ease-in-out infinite alternate; }
  #stagebox-launch-concepts .sb-cinematic-content { position:relative; padding:58px 34px 33px; }
  #stagebox-launch-concepts .sb-cinematic .sb-meter { margin-top:38px; max-width:310px; }
  #stagebox-launch-concepts .sb-edge-light { position:absolute; left:0; bottom:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--sb-green),transparent); box-shadow:0 0 18px var(--sb-green); }
  #stagebox-launch-concepts .sb-pulse { max-width:430px; min-height:375px; padding:32px 32px 29px; border-radius:24px; text-align:center; border:1px solid #6cbc9d38; background:radial-gradient(ellipse at 50% 24%,#184537,#142029 60%); }
  #stagebox-launch-concepts .sb-orbit { position:relative; width:116px; height:116px; margin:0 auto 22px; display:grid; place-items:center; }
  #stagebox-launch-concepts .sb-orbit svg { width:43px; height:43px; stroke-width:1.5; filter:drop-shadow(0 0 12px #ffffff35); }
  #stagebox-launch-concepts .sb-halo { position:absolute; inset:-17px; border:1px solid #64d2a629; border-radius:50%; animation:sb-halo 2.8s ease-out infinite; }
  #stagebox-launch-concepts .sb-orbit-track { position:absolute; inset:0; border:1px solid #66cca52b; border-radius:50%; }
  #stagebox-launch-concepts .sb-orbit-spin { position:absolute; inset:0; border:2px solid transparent; border-top-color:var(--sb-green); border-right-color:var(--sb-green); border-radius:50%; filter:drop-shadow(0 0 5px var(--sb-green)); animation:sb-spin 2s linear infinite; }
  #stagebox-launch-concepts .sb-pulse .sb-eyebrow { justify-content:center; }
  #stagebox-launch-concepts .sb-pulse h2 { font-size:32px; margin:12px 0 10px; }
  #stagebox-launch-concepts .sb-pulse .sb-meter { width:75%; margin:25px auto 0; }
  #stagebox-launch-concepts .sb-pulse .sb-confirm { margin-left:auto; margin-right:auto; }
  #stagebox-launch-concepts .sb-arcade { padding:31px 34px 30px; min-height:336px; border-radius:2px 23px 2px 23px; background:#111f26; border:1px solid #54cb9b32; }
  #stagebox-launch-concepts .sb-grid { position:absolute; inset:0; background:linear-gradient(100deg,#111f26 5%,#111f2680),repeating-linear-gradient(0deg,transparent 0 31px,#62b8940e 32px),repeating-linear-gradient(90deg,transparent 0 31px,#62b8940e 32px); }
  #stagebox-launch-concepts .sb-grid::after { content:""; position:absolute; width:130px; top:-20%; bottom:-20%; right:5%; background:linear-gradient(90deg,transparent,#22aa7714,transparent); transform:skew(-20deg); animation:sb-scan 4s ease-in-out infinite; }
  #stagebox-launch-concepts .sb-bracket { position:absolute; width:37px; height:37px; z-index:1; border-color:var(--sb-green); border-style:solid; filter:drop-shadow(0 0 5px #22aa7750); }
  #stagebox-launch-concepts .sb-bracket-tl { top:0; left:0; border-width:2px 0 0 2px; }
  #stagebox-launch-concepts .sb-bracket-br { bottom:0; right:0; border-width:0 2px 2px 0; }
  #stagebox-launch-concepts .sb-arcade-top { position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #stagebox-launch-concepts .sb-arcade-top svg { width:26px; height:26px; stroke-width:1.5; }
  #stagebox-launch-concepts .sb-arcade h2 { font-size:clamp(37px,7vw,52px); font-weight:750; text-transform:uppercase; letter-spacing:-1.5px; line-height:.99; margin:24px 0 24px; }
  #stagebox-launch-concepts .sb-arcade-bottom { position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #stagebox-launch-concepts .sb-arcade .sb-meter { margin-top:16px; height:6px; border-radius:0; mask-image:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 16px); }
  #stagebox-launch-concepts .sb-panel[data-status="Updating"] .sb-meter-fill { width:58%; background:var(--sb-green); animation:none; }
  #stagebox-launch-concepts .sb-panel[data-status="Error"] .sb-meter, #stagebox-launch-concepts .sb-panel[data-status="Error"] .sb-status-dot, #stagebox-launch-concepts .sb-panel[data-status="Error"] .sb-orbit-spin, #stagebox-launch-concepts .sb-panel[data-status="Error"] .sb-halo { display:none; }
  #stagebox-launch-concepts .sb-panel[data-motion="false"] *, #stagebox-launch-concepts .sb-panel[data-motion="false"] *::after { animation:none !important; }
  @keyframes sb-spin { to { transform:rotate(360deg); } }
  @keyframes sb-sweep { 0% { transform:translateX(-110%); } 100% { transform:translateX(400%); } }
  @keyframes sb-breathe { 50% { opacity:.45; } }
  @keyframes sb-halo { 0% { transform:scale(.85); opacity:0; } 30% { opacity:1; } 100% { transform:scale(1.2); opacity:0; } }
  @keyframes sb-float { to { transform:translate(-12px,-18px); } }
  @keyframes sb-scan { 50% { transform:translateX(-200px) skew(-20deg); } }
  @media(max-width:440px) { #stagebox-launch-concepts .sb-preview { padding:44px 12px 26px; min-height:520px; } #stagebox-launch-concepts .sb-cinematic-content { padding:65px 24px 32px; } #stagebox-launch-concepts .sb-pulse { padding:30px 22px; } #stagebox-launch-concepts .sb-arcade { padding:32px 24px; } #stagebox-launch-concepts .sb-moon { right:25px; } }
  @media(prefers-reduced-motion:reduce) { #stagebox-launch-concepts *, #stagebox-launch-concepts *::after { animation:none !important; } }
</style>
<script>
(() => {
  const root = document.getElementById('stagebox-launch-concepts');
  const saved = window.openai?.widgetState?.privateContent?.panels || {};
  const entries = [];
  root.querySelectorAll('[data-design]').forEach(panel => {
    const key = panel.dataset.design;
    const state = { status: 'Starting', motion: true };
    function restore(value) {
      if (!value) return;
      if (['Starting', 'Updating', 'Error'].includes(value.status)) state.status = value.status;
      if (typeof value.motion === 'boolean') state.motion = value.motion;
    }
    restore(saved[key]);
    function render() {
      panel.dataset.status = state.status;
      panel.dataset.motion = String(state.motion);
      panel.querySelector('[data-kicker]').textContent = state.status === 'Error' ? 'LAUNCH INTERRUPTED' : state.status === 'Updating' ? 'UPDATING GAME' : 'LAUNCHING GAME';
      panel.querySelector('[data-message]').textContent = state.status === 'Error' ? 'Internet connection is required to run this game.' : state.status === 'Updating' ? 'Downloading update…' : 'Starting game…';
      panel.querySelector('[data-caption]').hidden = state.status !== 'Updating';
      panel.querySelector('.sb-confirm').hidden = state.status !== 'Error';
      const meter = panel.querySelector('.sb-meter');
      meter.setAttribute('aria-label', state.status === 'Updating' ? 'Example download progress' : 'Game launch in progress');
      if (state.status === 'Updating') meter.setAttribute('aria-valuenow', '58');
      else meter.removeAttribute('aria-valuenow');
    }
    function remember() {
      const panels = Object.fromEntries(entries.map(entry => [entry.key, { ...entry.state }]));
      window.openai?.setWidgetState?.({ modelContent: { previewStates: panels }, privateContent: { panels } })?.catch(() => {});
    }
    render();
    entries.push({ key, state, restore, render });
    panel.querySelector('.sb-confirm').addEventListener('click', () => { state.status = 'Starting'; render(); remember(); });
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: panel, onChange: () => { render(); remember(); } });
      tweak.addSelect(state, 'status', { label: 'Preview state', options: ['Starting', 'Updating', 'Error'] });
      tweak.addToggle(state, 'motion', { label: 'Animation' });
    }
  });
  window.addEventListener('openai:set_globals', event => {
    const panels = event.detail?.globals?.widgetState?.privateContent?.panels;
    if (!panels) return;
    entries.forEach(entry => { entry.restore(panels[entry.key]); entry.render(); });
  });
})();
</script>
